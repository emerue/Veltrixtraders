<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction | Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .image-section {
            width: 100%;
            background: #f8f9fa;
            padding: 40px 40px 20px 40px;
            text-align: center;
            border-bottom: 1px solid #e9ecef;
        }
        
        .construction-image {
            max-width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
            transition: transform 0.3s ease;
        }
        
        .construction-image:hover {
            transform: scale(1.02);
        }
        
        .content-section {
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 2px;
            animation: fadeIn 1s ease-out 0.3s both;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .coming-soon {
            font-size: 2rem;
            color: #764ba2;
            margin-bottom: 30px;
            font-weight: 600;
            position: relative;
            display: inline-block;
            padding: 0 20px;
        }
        
        .coming-soon::before,
        .coming-soon::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #764ba2, transparent);
        }
        
        .coming-soon::before {
            left: -50px;
        }
        
        .coming-soon::after {
            right: -50px;
        }
        
        .description {
            color: #4a5568;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .countdown-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100px;
            height: 100px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .countdown-item span:first-child {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }
        
        .countdown-item span:last-child {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }
        
        .notify-form {
            display: flex;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .notify-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .notify-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .notify-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            white-space: nowrap;
        }
        
        .notify-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .notify-button:active {
            transform: translateY(0);
        }
        
        .social-links {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #764ba2;
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }
        
        .social-link:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            border-color: transparent;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            color: #718096;
            font-size: 0.9rem;
        }
        
        @media (max-width: 640px) {
            .image-section {
                padding: 30px 20px 10px 20px;
            }
            
            .construction-image {
                max-height: 200px;
            }
            
            .content-section {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .coming-soon {
                font-size: 1.5rem;
            }
            
            .coming-soon::before,
            .coming-soon::after {
                width: 20px;
            }
            
            .countdown-item {
                width: 70px;
                height: 70px;
            }
            
            .countdown-item span:first-child {
                font-size: 1.8rem;
            }
            
            .notify-form {
                flex-direction: column;
            }
            
            .notify-button {
                width: 100%;
            }
            
            .description {
                font-size: 1rem;
                padding: 0 15px;
            }
        }
        
        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            }
            
            .container {
                background: rgba(26, 32, 44, 0.95);
            }
            
            .image-section {
                background: #2d3748;
                border-bottom-color: #4a5568;
            }
            
            .description {
                color: #cbd5e0;
            }
            
            .social-link {
                background: #2d3748;
                border-color: #4a5568;
                color: #cbd5e0;
            }
            
            .footer {
                border-top-color: #4a5568;
                color: #a0aec0;
            }
            
            .notify-input {
                background: #2d3748;
                border-color: #4a5568;
                color: white;
            }
            
            .notify-input::placeholder {
                color: #a0aec0;
            }
        }
    </style>
    <!-- Font Awesome for social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        {% comment %} <div class="image-section">
            <img src="../static/img/construction.jpg" alt="Under Construction" class="construction-image">
        </div> {% endcomment %}
        
        <div class="content-section">
            <h1>UNDER CONSTRUCTION</h1>
            <div class="coming-soon">COMING SOON</div>
            
            <p class="description">
                We're working hard to bring you something amazing. 
                Our website is currently under construction, but we'll be launching soon!
            </p>
            
            <!-- Optional countdown timer -->
            <div class="countdown-container">
                <div class="countdown-item">
                    <span id="days">15</span>
                    <span>Days</span>
                </div>
                <div class="countdown-item">
                    <span id="hours">08</span>
                    <span>Hours</span>
                </div>
                <div class="countdown-item">
                    <span id="minutes">32</span>
                    <span>Minutes</span>
                </div>
                <div class="countdown-item">
                    <span id="seconds">45</span>
                    <span>Seconds</span>
                </div>
            </div>
            
            {% comment %} <!-- Email notification form -->
            <form class="notify-form" id="notifyForm" action="#" method="POST">
                <input type="email" class="notify-input" placeholder="Enter your email" required>
                <button type="submit" class="notify-button">Notify Me</button>
            </form>
             {% endcomment %}
            <!-- Social media links -->
            <div class="social-links">
                <a href="#" class="social-link" target="_blank" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" class="social-link" target="_blank" title="Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="#" class="social-link" target="_blank" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#" class="social-link" target="_blank" title="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
            </div>
            
            <div class="footer">
                &copy; 2026 All Rights Reserved
            </div>
        </div>
    </div>

    <script>
        // Optional countdown timer
        function updateCountdown() {
            // Set the launch date (example: 30 days from now)
            const launchDate = new Date();
            launchDate.setDate(launchDate.getDate() + 15);
            
            const countdown = setInterval(function() {
                const now = new Date().getTime();
                const distance = launchDate - now;
                
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                
                document.getElementById('days').textContent = String(days).padStart(2, '0');
                document.getElementById('hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
                
                if (distance < 0) {
                    clearInterval(countdown);
                    document.querySelector('.countdown-container').innerHTML = '<h2>We\'re Live!</h2>';
                }
            }, 1000);
        }
        
        // Call the countdown function
        updateCountdown();
        
        // Form submission handler
        document.getElementById('notifyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = this.querySelector('input[type="email"]').value;
            
            // Simple validation
            if (email && email.includes('@')) {
                // Here you would typically send this to your backend
                alert('Thank you for your interest! We\'ll notify you when we launch.');
                this.reset();
            } else {
                alert('Please enter a valid email address.');
            }
        });
        
        // Add smooth reveal on scroll
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);
        
        // Observe elements for animation
        document.querySelectorAll('.countdown-item, .notify-form, .social-links').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px)';
            el.style.transition = 'all 0.6s ease-out';
            observer.observe(el);
        });
    </script>
</body>
</html>
