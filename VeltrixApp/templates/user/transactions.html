{% extends "user/includes/header.html" %}
{% load static %}

{% block title %}All Transactions - Veltrixtraders{% endblock %}

{% block content %}
<div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10 mb-20">
    <div class="w-full bg-white dark:bg-gray-950 rounded-lg shadow-sm overflow-hidden">
        <div class="p-4 border-b border-gray-200 dark:border-gray-900">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-semibold text-gray-800 dark:text-white">
                    All Transactions
                </h2>
                <div class="flex items-center text-xs text-gray-500 dark:text-gray-400">
                    <span>Updated 07:12 PM</span>
                    <button class="ml-2 p-1 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw h-3.5 w-3.5 text-gray-400">
                            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                            <path d="M21 3v5h-5"></path>
                            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                            <path d="M8 16H3v5"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="mt-2 relative">
                <input type="text" placeholder="Search transactions..." class="w-full pl-8 pr-3 py-1.5 bg-gray-50 dark:bg-transparent border border-gray-200 dark:border-gray-900 rounded-md text-xs text-gray-700 dark:text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-blue-400" value="" />
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search absolute left-2 top-2 h-3.5 w-3.5 text-gray-400">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </svg>
            </div>
        </div>

        <div class="max-h-96 overflow-y-auto">
            <ul class="divide-y divide-gray-100 dark:divide-gray-700">
                <li class="px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-800 transition duration-150 ease-in-out">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="p-1.5 rounded-full bg-green-50 dark:bg-green-900/30">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-down-right h-4 w-4 text-green-500 dark:text-green-400">
                                    <path d="m7 7 10 10"></path>
                                    <path d="M17 7v10H7"></path>
                                </svg>
                            </div>
                            <div>
                                <h3 class="text-sm font-medium text-gray-800 dark:text-white">Executed</h3>
                                <p class="text-xs text-gray-500 dark:text-gray-400">Mar 8, 2026 at 02:50 PM</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-medium text-green-600 dark:text-green-400">+$100.00</span>
                            <p class="text-xs mt-0.5">
                                <span class="inline-block px-1.5 py-0.5 rounded-sm text-xs bg-amber-50 text-amber-700 ring-1 ring-amber-600/20 dark:bg-amber-950/50 dark:text-amber-300 dark:ring-amber-400/30">Pending</span>
                            </p>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}
