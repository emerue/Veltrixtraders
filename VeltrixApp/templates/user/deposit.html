{% extends "user/includes/header.html" %}
{% load static %}

{% block title %}Deposit - Veltrixtraders{% endblock %}

{% block content %}
<div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10 mb-20">
    <div class="w-full flex justify-center shadow-1 m-auto">
        <div class="w-full max-w-sm p-4 bg-white border border-gray-200 rounded-lg shadow sm:p-6 md:p-8 dark:bg-gray-950 dark:border-gray-900">
            <form class="space-y-6" action="{% url 'deposit' %}" method="POST" 
                  x-data="{
                    usdAmount: '',
                    selectedCrypto: '',
                    cryptoAmount: 0,
                    minDeposit: {{ min_deposit|default:1 }},
                    paymentMethods: {{ payment_methods|safe }},
                    exchangeRates: {{ exchange_rates|safe }},
                    
                    updateCryptoAmount() {
                        if (!this.selectedCrypto || !this.usdAmount) {
                            this.cryptoAmount = 0;
                            return;
                        }
                        
                        const method = this.paymentMethods.find(m => m.ulid === this.selectedCrypto);
                        const exchangeRate = this.exchangeRates[method.config.symbol.toUpperCase()];
                        
                        if (!method || !exchangeRate) {
                            this.cryptoAmount = 0;
                            return;
                        }
                        
                        this.cryptoAmount = (parseFloat(this.usdAmount) * parseFloat(exchangeRate)).toFixed(8);
                    }
                  }"
                  x-init="$watch('usdAmount', () => updateCryptoAmount());
                          $watch('selectedCrypto', () => updateCryptoAmount());">
                {% csrf_token %}
                <h5 class="text-xl font-medium text-gray-900 dark:text-white">
                    Start Deposit
                </h5>
                <div class="flex gap-5">
                    <div class="flex-auto">
                        <label for="cryptocurrency" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Select Method
                        </label>
                        <select name="cryptocurrency" id="cryptocurrency" 
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-900 dark:border-gray-800 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 capitalize"
                                required x-model="selectedCrypto">
                            <option value="">Select cryptocurrency</option>
                            {% for method in payment_methods %}
                            <option value="{{ method.ulid }}">{{ method.name }} - {{ method.config.symbol }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="flex-auto">
                        <label for="usd_amount" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Amount In USD
                        </label>
                        <input type="number" name="usd_amount" id="usd_amount" 
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-900 dark:border-gray-800 dark:placeholder-gray-400 dark:text-white"
                               placeholder="0.00" required min="0.01" step="0.01" x-model="usdAmount" />
                    </div>
                </div>
                <div class="flex flex-col gap-5">
                    <div class="flex-auto">
                        <label for="convertedAmount" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white capitalize">
                            Amount in
                            <span x-text="selectedCrypto ? paymentMethods.find(m => m.ulid === selectedCrypto)?.name || 'cryptocurrency' : 'cryptocurrency'"></span>
                        </label>
                        <input type="number" id="convertedAmount" 
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-900 dark:border-gray-800 dark:placeholder-gray-400 dark:text-white"
                               disabled readonly x-model="cryptoAmount" step="0.00000001" />
                    </div>
                    <div class="flex-auto">
                        <label for="minDeposit" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Minimum Deposit
                        </label>
                        <input type="number" id="minDeposit" 
                               class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-900 dark:border-gray-800 dark:placeholder-gray-400 dark:text-white"
                               disabled readonly x-model="minDeposit" />
                    </div>
                </div>
                <button type="submit" 
                        class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                    Create Deposit
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
