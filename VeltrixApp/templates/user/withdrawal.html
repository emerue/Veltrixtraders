{% extends "user/includes/header.html" %}
{% load static %}

{% block title %}Withdrawal - Veltrixtraders{% endblock %}

{% block content %}
<div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10 mb-20">
    <div class="w-full flex justify-center shadow-1 m-auto">
        <div class="w-full max-w-sm p-4 bg-white border border-gray-200 rounded-lg shadow sm:p-6 md:p-8 dark:bg-gray-950 dark:border-gray-900">
            <form class="space-y-6" action="{% url 'withdrawal' %}" method="POST"
                x-data="{
                    usdAmount: '',
                    selectedCrypto: '01K0R87W0TTSJ1BRX1Y81R7KFJ',
                    cryptoAmount: 0,
                    withdrawalMethods: {{ withdrawal_methods|safe }},
                    exchangeRates: {{ exchange_rates|safe }},
                    
                    updateCryptoAmount() {
                        if (!this.selectedCrypto || !this.usdAmount) {
                            this.cryptoAmount = 0;
                            return;
                        }
                    
                        const method = this.withdrawalMethods.find(m => m.ulid === this.selectedCrypto);
                        const exchangeRate = this.exchangeRates[method.config.symbol.toUpperCase()];
                    
                        if (!method || !exchangeRate) {
                            this.cryptoAmount = 0;
                            return;
                        }
                    
                        this.cryptoAmount = (parseFloat(this.usdAmount) * parseFloat(exchangeRate)).toFixed(8);
                    }
                }"
                x-init="$watch('usdAmount', () => updateCryptoAmount());
                    $watch('selectedCrypto', () => updateCryptoAmount());"
            >
                {% csrf_token %}
                <h5 class="text-xl font-medium text-gray-900 dark:text-white">
                    Start Withdraw
                </h5>
                <div class="flex gap-5">
                    <div class="flex-auto">
                        <label for="cryptocurrency" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Select Method
                        </label>
                        <select name="cryptocurrency" id="cryptocurrency" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-900 dark:border-gray-800 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500 capitalize" required="" x-model="selectedCrypto">
                            <option value="01K0R87W0TTSJ1BRX1Y81R7KFJ">Bitcoin - BTC</option>
                            <option value="01K0R87W0TTSJ1BRX1Y81R7KFK">USDT - ERC20</option>
                            <option value="01K0R87W0V1B4P3SRKKMWD7W2W">Ethereum - ETH</option>
                            <option value="01K0R87W0V1B4P3SRKKMWD7W2X">USDT - TRC20</option>
                            <option value="01K0R87W0WNMXQD94KX5MC4BM9">Solana - SOL</option>
                            <option value="01K0R87W0WNMXQD94KX5MC4BMA">XRP - XRP</option>
                        </select>
                    </div>
                    <div class="flex-auto">
                        <label for="usd_amount" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Amount In USD
                        </label>
                        <input type="number" name="usd_amount" id="usd_amount" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-900 dark:border-gray-800 dark:placeholder-gray-400 dark:text-white" placeholder="0.00" required="" min="10" step="0.01" value="" x-model="usdAmount" />
                    </div>
                </div>
                <div class="flex gap-5">
                    <div class="flex-auto">
                        <label for="wallet_address" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Wallet Address
                        </label>
                        <input type="text" name="wallet_address" id="wallet_address" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-900 dark:border-gray-800 dark:placeholder-gray-400 dark:text-white" placeholder="Enter Wallet Address" required="" value="" />
                    </div>
                    <div class="flex-auto">
                        <label for="network" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                            Network
                        </label>
                        <input type="text" name="network" id="network" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-900 dark:border-gray-800 dark:placeholder-gray-400 dark:text-white" placeholder="Enter Wallet Network" required="" value="" />
                    </div>
                </div>
                <div class="flex flex-col gap-5">
                    <div class="flex-auto">
                        <label for="convertedAmount" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white capitalize">
                            Amount in
                            <span x-text="selectedCrypto ? withdrawalMethods.find(m => m.ulid === selectedCrypto)?.name || 'cryptocurrency' : 'cryptocurrency'">Bitcoin</span>
                        </label>
                        <input type="number" id="convertedAmount" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-900 dark:border-gray-800 dark:placeholder-gray-400 dark:text-white" disabled="" readonly="" x-model="cryptoAmount" step="0.00000001" />
                    </div>
                </div>
                <button type="submit" class="w-full text-white font-medium rounded-lg text-sm px-5 py-2.5 text-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                    Withdraw
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
