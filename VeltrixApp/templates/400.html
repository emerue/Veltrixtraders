{% extends "user/includes/header.html" %}
{% load static %}

{% block title %}Bad Request - Veltrixtraders{% endblock %}

{% block content %}
<div class="mx-auto max-w-screen-2xl p-4 md:p-6 2xl:p-10 mb-20 min-h-screen flex items-center justify-center">
    <div class="text-center">
        <div class="mb-8 flex justify-center">
            <div class="relative">
                <div class="w-48 h-48 rounded-full bg-gradient-to-b from-orange-500/20 to-orange-500/5 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-orange-500">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <div class="absolute -top-4 -right-4">
                    <span class="text-8xl font-bold text-orange-500/20">400</span>
                </div>
            </div>
        </div>
        <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-4">
            Bad Request
        </h1>
        <p class="text-lg text-gray-600 dark:text-gray-400 mb-8 max-w-md mx-auto">
            The request could not be understood by the server.
        </p>
        <a href="{% url 'dashboard' %}" class="inline-flex items-center justify-center px-6 py-3 bg-brandblue hover:bg-blue-600 text-white font-semibold rounded-lg">
            Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
