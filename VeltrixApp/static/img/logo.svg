<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a7bd5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563c4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="logoClip">
      <rect width="520" height="120" rx="6"/>
    </clipPath>
  </defs>

  <!-- Subtle grid texture overlay (removed background, kept texture) -->
  <rect width="520" height="120" rx="6" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.03"/>

  <!-- ===== MONOGRAM BLOCK ===== -->
  <!-- V letter (blue) -->
  <g filter="url(#glow)">
    <!-- V shape using polygon - bold, strong -->
    <polygon points="14,18 30,18 52,82 74,18 90,18 60,96 44,96" fill="url(#blueGrad)"/>
  </g>

  <!-- Diagonal slash accent (white, like Mirage Traders) -->
  <line x1="78" y1="14" x2="62" y2="100" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>

  <!-- T letter (white) — slightly overlapping, offset right -->
  <g>
    <!-- T crossbar -->
    <rect x="72" y="18" width="46" height="13" rx="1" fill="#ffffff"/>
    <!-- T stem -->
    <rect x="88" y="31" width="14" height="55" rx="1" fill="#ffffff"/>
  </g>

  <!-- Thin separator line -->
  <line x1="132" y1="22" x2="132" y2="96" stroke="#2a3a5c" stroke-width="1" opacity="0.8"/>

  <!-- ===== TEXT BLOCK ===== -->
  <text
    x="148"
    y="58"
    font-family="'Trebuchet MS', 'Franklin Gothic Medium', 'Arial Narrow', sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="5"
    fill="#ffffff"
    dominant-baseline="middle"
  >VELTRIX</text>

  <text
    x="150"
    y="85"
    font-family="'Trebuchet MS', 'Franklin Gothic Medium', 'Arial Narrow', sans-serif"
    font-size="22"
    font-weight="400"
    letter-spacing="8"
    fill="#c8d0e0"
    dominant-baseline="middle"
  >TRADERS</text>

  <!-- Bottom accent line (subtle blue) -->
  <rect x="148" y="100" width="200" height="1.5" rx="1" fill="#2563c4" opacity="0.5"/>
</svg>